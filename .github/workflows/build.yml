name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo test
        working-directory: src-tauri

  macos-app:
    runs-on: macos-latest
    needs: test
    env:
      # Same certificate on every build, so macOS remembers folder permissions between versions.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: scripts/fetch-upscaler.sh
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: scripts/import-signing-cert.sh
      - run: npm run tauri build -- --target universal-apple-darwin --bundles dmg --config src-tauri/tauri.macos-upscale.json
      - name: Show signature
        run: codesign -dv --verbose=2 src-tauri/target/universal-apple-darwin/release/bundle/macos/Imagime.app 2>&1 | grep -E 'Identifier|Authority|Signature' || true
      - uses: actions/upload-artifact@v4
        with:
          name: Imagime-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
